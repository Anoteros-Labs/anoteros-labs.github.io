<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moved — Watchside support</title>
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://anoteros-labs.github.io/watchside/support/" />
    <link rel="icon" href="data:," />
    <!--
      Kickback is now Watchside, and these pages live under /watchside/.

      This path is NOT retired. Invite links are shared in DMs and never
      edited afterwards, and the Chrome Web Store listing points its privacy
      and support URLs here. Anything already published under /kickback/ has
      to keep working for as long as it might be clicked, which is forever.

      So this file forwards. Two mechanisms, because they fail differently:

        * the script preserves the query string, which is the whole point -
          an invite carries ?c=CODE and losing it would silently cost the
          sender their referral credit;
        * the meta refresh runs when scripting is off, arriving at the page
          without the code. The visitor still reaches Watchside and can still
          install it; only the attribution is lost. That is the correct thing
          to degrade to.

      No loop is possible: the target path is /watchside/, which is a real
      page and never forwards anywhere.
    -->
    <meta http-equiv="refresh" content="0; url=/watchside/support/" />
    <script>
      // replace(), not assign(): the old URL should not sit in history where
      // Back would bounce the visitor straight back out again.
      location.replace('/watchside/support/' + location.search + location.hash)
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      a { color: #ff8a00; }
    </style>
  </head>
  <body>
    <p>
      Kickback is now Watchside.
      <br />
      <a id="onward" href="/watchside/support/">Continue to Watchside support</a>
    </p>
    <script>
      // Only reached if the redirect above was blocked. Carry the code on the
      // link too, so a manual click is not a worse outcome than an automatic
      // one.
      document
        .getElementById('onward')
        .setAttribute('href', '/watchside/support/' + location.search + location.hash)
    </script>
  </body>
</html>
